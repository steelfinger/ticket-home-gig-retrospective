<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%">
      <stop offset="0%" stop-color="#2a1a3e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid lines like a map -->
  <g stroke="#ffffff08" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Arc lines suggesting travel routes -->
  <g fill="none" stroke="#d4a037" stroke-width="1" opacity="0.3">
    <path d="M 350 250 Q 300 180 200 220"/>
    <path d="M 350 250 Q 280 200 180 280"/>
    <path d="M 350 250 Q 400 150 500 200"/>
    <path d="M 350 250 Q 320 300 250 350"/>
    <path d="M 350 250 Q 500 100 700 180"/>
    <path d="M 350 250 Q 380 200 450 230"/>
  </g>

  <!-- Helsinki home dot -->
  <circle cx="350" cy="250" r="6" fill="#d4a037"/>
  <circle cx="350" cy="250" r="12" fill="none" stroke="#d4a037" stroke-width="1" opacity="0.5"/>

  <!-- Destination dots -->
  <circle cx="200" cy="220" r="3" fill="#d4a037" opacity="0.6"/>
  <circle cx="180" cy="280" r="3" fill="#d4a037" opacity="0.6"/>
  <circle cx="500" cy="200" r="3" fill="#d4a037" opacity="0.6"/>
  <circle cx="250" cy="350" r="3" fill="#d4a037" opacity="0.6"/>
  <circle cx="700" cy="180" r="3" fill="#d4a037" opacity="0.6"/>
  <circle cx="450" cy="230" r="3" fill="#d4a037" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#f0e6d3">Ticket Home</text>

  <!-- Subtitle -->
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#d4a037">Concert Travels from Helsinki</text>

  <!-- Stats line -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a">37 gigs  ·  8 countries  ·  2012–2025</text>
</svg>
